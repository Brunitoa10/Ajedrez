# =============================================================
#  Configuración de Ajedrez
# =============================================================
# Motor de base de datos: sqlite (por defecto, portable) o postgresql
db.type=sqlite

# --- SQLite -------------------------------------------------
# Ruta relativa a la carpeta de la aplicación (viaja con el pendrive)
db.sqlite.file=data/ajedrez.db

# --- PostgreSQL ---------------------------------------------
# Para usarlo: cambiar db.type=postgresql y crear la base vacía:
#   CREATE DATABASE ajedrez;
# Las tablas se crean solas al iniciar. Si no se puede conectar,
# la aplicación vuelve automáticamente a SQLite y lo avisa.
db.postgres.url=jdbc:postgresql://localhost:5432/ajedrez
db.postgres.user=postgres
db.postgres.password=
